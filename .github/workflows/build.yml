name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with the built executables"
        type: boolean
        default: false
      release_tag:
        description: "Release tag (used when publishing, e.g. v2.1.0)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build executables (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Build executables with PyInstaller
        run: python -m PyInstaller --clean --noconfirm build.spec

      - name: Smoke-test the console executable
        run: |
          .\dist\dcontrol-cli.exe --version
          .\dist\dcontrol-cli.exe status

      - name: Compute checksums
        run: |
          Get-FileHash .\dist\dControl.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  dControl.exe" } |
            Out-File -Encoding ascii .\dist\SHA256SUMS.txt
          Get-FileHash .\dist\dcontrol-cli.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  dcontrol-cli.exe" } |
            Out-File -Encoding ascii -Append .\dist\SHA256SUMS.txt
          Get-Content .\dist\SHA256SUMS.txt

      - name: Package the release archive
        run: |
          Compress-Archive -Path .\dist\dControl.exe, .\dist\dcontrol-cli.exe, .\dist\SHA256SUMS.txt `
            -DestinationPath .\dist\defender-control-windows.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: defender-control-windows
          path: |
            dist/dControl.exe
            dist/dcontrol-cli.exe
            dist/SHA256SUMS.txt
            dist/defender-control-windows.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    runs-on: ubuntu-latest

    steps:
      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: defender-control-windows
          path: dist

      - name: Determine the release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: List the files that will be published
        run: ls -l dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "Defender Control $TAG" \
              --generate-notes
          fi